service: asset-manager-microservice

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs18.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  memorySize: 512
  timeout: 30

  # Variables de entorno
  environment:
    NODE_ENV: ${self:provider.stage}
    DB_HOST: ${env:DB_HOST}
    DB_PORT: ${env:DB_PORT}
    DB_USERNAME: ${env:DB_USERNAME}
    DB_PASSWORD: ${env:DB_PASSWORD}
    DB_DATABASE: ${env:DB_DATABASE}
    DB_SYNCHRONIZE: false
    DB_LOGGING: false
    AWS_REGION_CUSTOM: ${self:provider.region}
    S3_IMAGES_BUCKET: ${env:S3_IMAGES_BUCKET}
    S3_DOCUMENTS_BUCKET: ${env:S3_DOCUMENTS_BUCKET}
    PRESIGNED_URL_EXPIRATION: ${env:PRESIGNED_URL_EXPIRATION, '3600'}
    MAX_FILE_SIZE_IMAGE: ${env:MAX_FILE_SIZE_IMAGE, '10485760'}
    MAX_FILE_SIZE_DOCUMENT: ${env:MAX_FILE_SIZE_DOCUMENT, '52428800'}
    ALLOWED_IMAGE_TYPES: ${env:ALLOWED_IMAGE_TYPES, 'image/jpeg,image/png,image/gif,image/webp,image/svg+xml'}
    ALLOWED_DOCUMENT_TYPES: ${env:ALLOWED_DOCUMENT_TYPES, 'application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}

  # Permisos IAM
  iam:
    role:
      statements:
        # Permisos para S3
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
            - s3:HeadObject
          Resource:
            - arn:aws:s3:::${env:S3_IMAGES_BUCKET}/*
            - arn:aws:s3:::${env:S3_DOCUMENTS_BUCKET}/*
        - Effect: Allow
          Action:
            - s3:ListBucket
          Resource:
            - arn:aws:s3:::${env:S3_IMAGES_BUCKET}
            - arn:aws:s3:::${env:S3_DOCUMENTS_BUCKET}

  # Configuración de API Gateway
  apiGateway:
    shouldStartNameWithService: true
    binaryMediaTypes:
      - 'multipart/form-data'
      - '*/*'

# Plugins
plugins:
  - serverless-plugin-typescript
  - serverless-offline

# Funciones Lambda
functions:
  api:
    handler: src/lambda.handler
    events:
      - http:
          method: ANY
          path: /
          cors: true
      - http:
          method: ANY
          path: /{proxy+}
          cors: true
    # VPC Configuration (opcional - descomenta si necesitas conectar a RDS en VPC)
    # vpc:
    #   securityGroupIds:
    #     - sg-xxxxxxxxx
    #   subnetIds:
    #     - subnet-xxxxxxxxx
    #     - subnet-yyyyyyyyy

# Configuración de empaquetado
package:
  individually: true
  patterns:
    - '!node_modules/**'
    - '!.git/**'
    - '!.vscode/**'
    - '!database/**'
    - '!README.md'
    - '!.env*'

# Recursos adicionales de CloudFormation (opcional)
# resources:
#   Resources:
#     # Puedes agregar recursos adicionales aquí
#     # Por ejemplo: tablas DynamoDB, buckets S3, etc.

# Custom variables
custom:
  serverless-offline:
    httpPort: 3000
    noPrependStageInUrl: true
